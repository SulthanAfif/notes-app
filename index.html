<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Notes App</h1>
            <div class="header-actions">
                <button id="exportBtn" class="icon-btn" title="Export JSON">📥</button>
                <button id="darkModeToggle" class="dark-mode-btn">🌙</button>
            </div>
        </header>

        <div class="toolbar">
            <input type="text" id="searchInput" placeholder="Cari catatan atau tag...">
            <button id="addNoteBtn" class="btn primary">+ Baru</button>
        </div>

        <div class="controls">
            <div class="filters">
                <button class="filter-btn active" data-filter="all">Semua</button>
                <button class="filter-btn" data-filter="pinned">Di-pin</button>
                <button class="filter-btn" data-filter="archived">Arsip</button>
            </div>
            <select id="sortSelect">
                <option value="newest">Terbaru</option>
                <option value="oldest">Terlama</option>
                <option value="title">Judul A-Z</option>
            </select>
        </div>

        <!-- Form -->
        <div id="noteFormContainer" class="note-form-container hidden">
            <form id="noteForm">
                <input type="text" id="noteTitle" placeholder="Judul catatan..." required maxlength="100">
                <textarea id="noteContent" placeholder="Tulis catatanmu di sini..." rows="7" required></textarea>

                <div class="form-meta">
                    <span id="charCount">0 karakter · 0 kata</span>
                </div>

                <div class="form-row">
                    <select id="noteColor">
                        <option value="default">Default</option>
                        <option value="yellow">Kuning</option>
                        <option value="blue">Biru</option>
                        <option value="green">Hijau</option>
                        <option value="pink">Pink</option>
                        <option value="purple">Ungu</option>
                    </select>

                    <input type="text" id="noteTags" placeholder="Tags (pisahkan dengan koma)">
                    
                    <label class="pin-label">
                        <input type="checkbox" id="notePinned"> Pin
                    </label>
                </div>

                <div class="form-actions">
                    <button type="submit" id="saveBtn" class="btn primary">Simpan</button>
                    <button type="button" id="cancelBtn" class="btn secondary">Batal</button>
                </div>
            </form>
        </div>

        <div id="notesList" class="notes-list"></div>
        <p id="emptyMessage" class="empty-message hidden">Belum ada catatan.<br>Tekan <strong>Ctrl + N</strong> atau klik tombol + Baru</p>
    </div>

    <!-- Modal -->
    <div id="noteModal" class="modal hidden">
        <div class="modal-content">
            <button id="closeModal" class="close-btn">×</button>
            <h2 id="modalTitle"></h2>
            <div id="modalMeta" class="modal-meta"></div>
            <div id="modalTags" class="modal-tags"></div>
            <div id="modalContent" class="modal-body"></div>
            <div class="modal-actions">
                <button id="modalEditBtn" class="btn primary">Edit</button>
                <button id="modalDuplicateBtn" class="btn secondary">Duplikat</button>
                <button id="modalArchiveBtn" class="btn secondary">Arsipkan</button>
                <button id="modalDeleteBtn" class="btn danger">Hapus</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
